# ── Routes: task_type × complexity → candidates + effort ─────────────────────
# `models` = ordered preference BEFORE vision filter + quota tiebreak (fit list).
# Pipeline: route cell → drop NV if requires_vision → quota veto/rank → pick.
# `effort` is applied only if supports_reasoning_effort = true for the winner.
#
# Tiers used below (edit freely):
#   cheap  = haiku, luna, flash-lite, smaller opencode
#   mid    = sonnet, terra, grok-4.5, gemini-pro, qwen-plus, minimax-m3, glm
#   top    = opus, fable, sol, grok-4.5, qwen-max

# ── scout (tool ceiling: unrestricted) ────────────────────────────────────────────

[routes.scout.low]
models = [
  "claude-haiku-4-5-20251001",
  "gemini-3.1-flash-lite",
  "gpt-5.6-luna",
  "opencode-mimo-v2.5",
  "opencode-qwen3.6-plus",
]
effort = "medium"

