# Subagent Router — model/effort/tool selection for child agents
#
# Parent sends: task_type + complexity + requires_vision
#               (+ optional error-path model override).
# This file decides: candidate models, reasoning effort, vision
# filter, and how CodexBar quota breaks ties.
# Tool ceiling is always general-purpose (not a knob).
#
# Docs (fork): overlay/subagent-router/CONTEXT.md
# Sensor:     codexbar usage --format json  (must be on PATH)

# ── Sensor (CodexBar CLI) ────────────────────────────────────────────────────

[sensor]
# Binary name or absolute path. Default install: /opt/homebrew/bin/codexbar
command = "codexbar"

# Base args; the router appends --provider <id> for each needed provider.
# Full multi-provider probes can take ~1–2 minutes — never use "all" on the hot path.
usage_args = ["usage", "--format", "json"]

# How long a successful usage snapshot is reused (seconds).
cache_ttl_secs = 90

# Per-provider fetch deadline (seconds). Timed-out providers are dropped and
# trigger a macOS notification (any single failure notifies). Probes run in
# parallel, so one hung provider no longer serializes the rest.
timeout_secs = 25

# When live `codexbar usage` fails, accept the CodexBar menu-bar app's history
# sample if newer than this many seconds (0 = disable). Covers OpenCode when
# the CLI cannot import browser cookies in the background.
history_fallback_max_age_secs = 43200

notify_on_provider_error = true
# macOS notification: auto | osascript | terminal-notifier | none
# `auto` prefers terminal-notifier when installed, else osascript + Glass sound
# + afplay so banners aren't silent when Script Editor NC is off.
notify_command = "auto"

# ── Usage windows ────────────────────────────────────────────────────────────
# CodexBar returns primary/secondary/tertiary (+ extraRateWindows) with
# usedPercent + windowMinutes — not named session/weekly/monthly.
# We classify by duration, then:
#   1) veto if any *present* window is exhausted (extraRateWindows included)
#   2) rank survivors by weekly-class remaining / time-to-reset
#   3) session-class as fine tiebreak
# Credits (e.g. codex credits.remaining) are informational only — never a veto.

[windows]
# remaining% = 100 - usedPercent. At or below this floor → exhaustion veto.
min_remaining_percent = 1

# Class thresholds (minutes). Tune if a provider invents weird windows.
session_max_minutes = 360       # ≤ 6h  → session
weekly_min_minutes  = 1440      # ≥ 1d
weekly_max_minutes  = 11520     # ≤ 8d  → weekly
monthly_min_minutes = 40320     # ≥ 28d → monthly

# ── Tool ceiling ─────────────────────────────────────────────────────────────
# Every child uses the unrestricted general-purpose runtime. Task type still
# selects the model, effort, and persona intent; it does not remove tools.
# Plan stays on the parent agent — not a child task type.

# ── Fallback & error-path override ───────────────────────────────────────────
# Empty quota / failed sensors / vision-empty pool → parent session model.
# That fallback is not configurable.

[override]
# Optional `model` on the spawn tool: error-path only (tool description must say so).
# Always honored blindly (no fit / quota / vision veto), independent of this table.
# `notify_on_use` gates the macOS notification only.
notify_on_use = true

# ── Vision ───────────────────────────────────────────────────────────────────
# Tool arg: requires_vision (bool, default false).
# When true, drop every catalog model with supports_vision = false (NV / no-vision)
# from the route cell BEFORE quota ranking. Parent should set true if the child
# must read images/screenshots/UI captures in the prompt or tools.
#
# NV in Grok display names ≈ no vision. Marked supports_vision = false below.

[vision]
# Default for the tool when the parent omits the field.
default_requires_vision = false
# If requires_vision and every candidate is filtered out → parent-model fallback
# (same as empty quota pool), unless error-path model override is set.

# ── Model catalog: Grok slug → CodexBar provider + capabilities ──────────────
# Every slug referenced in [routes.*] MUST appear here.
# provider ids must match CodexBar (claude, codex, gemini, opencodego, copilot, …).
# supports_vision = false  →  "NV" (no vision); excluded when requires_vision = true

[models.claude-fable-5]
provider = "claude"
supports_reasoning_effort = true
supports_vision = true

