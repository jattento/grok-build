[package]
name = "overlay-subagent-router"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Intent-based subagent model/effort/tool routing with CodexBar quota"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "subagent-router-smoke"
path = "src/bin/smoke.rs"
